<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drawing Management System</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <!-- ELEGANT LOGIN SCREEN -->
    <div id="login-screen">
        <div class="login-box">
            <h2>System Access</h2>
            <p>Please log in to view project drawings.</p>
            <input type="text" id="username" placeholder="Username">
            <input type="password" id="password" placeholder="Password">
            <button id="login-btn">Secure Login</button>
            <p id="login-error" style="color: var(--clr-orange); display: none; margin-top: 10px; font-size: 0.9rem;">Invalid credentials</p>
        </div>
    </div>

    <!-- MAIN APP DASHBOARD (Hidden until logged in) -->
    <div id="app-container" style="display: none;">
        <header>
            <div class="header-content">
                <h1>Drawing Management System</h1>
                <input type="text" id="search-bar" placeholder="Search drawing no, description, or folder...">
            </div>
        </header>
        <header>
    <div class="header-content">
        <h1>Drawing Management System</h1>
        <div style="display: flex; gap: 10px; align-items: center;">
            <input type="text" id="search-bar" placeholder="Search drawing no, description, or folder...">
            <button id="offline-btn" title="Download all drawings for offline use">Available Offline</button>
        </div>
    </div>
</header>
        <div class="container">
            <aside id="sidebar">
                <h2>Folders</h2>
                <ul id="folder-list"></ul>
            </aside>
            <main>
                <h2 id="current-folder-title">Select a folder</h2>
                <div id="drawings-grid" class="grid"></div>
            </main>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js')
                .then(() => console.log("Offline capabilities activated!"))
                .catch(err => console.log("Offline error:", err));
        }
    </script>
</body>
</html>
